<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercises - WebStack</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    const theme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
  </script>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo">
        <h1><a href="index.html">WebStack</a></h1>
      </div>
      <button class="hamburger-menu" id="hamburger">
        <span></span><span></span><span></span>
      </button>
      <nav id="nav-menu"></nav>
    </div>
  </header>

  <main class="content">
    <h1 style="text-align:center; margin-bottom:2rem;color:#333;">Practice Exercises</h1>
    <div style="max-width:800px;margin:0 auto;">
      <div style="margin-bottom:2rem;">
        <h2>HTML Form Exercise</h2>
        <textarea id="code-area" style="width:100%;height:150px;" placeholder="Write your HTML here..."></textarea>
        <button class="btn btn-primary" id="save-progress" style="margin-top:1rem;">Save Progress</button>
        <div id="exercise-status" style="margin-top:1rem;color:#2563eb;"></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-bottom">
      <p>&copy; 2026 WebStack. All rights reserved.</p>
    </div>
  </footer>

  <script src="site.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = getCurrentUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('save-progress').addEventListener('click', async () => {
        const code = document.getElementById('code-area').value;
        try {
          const res = await apiRequest('/api/exercises/save-progress', {
            method: 'POST',
            body: { userId: user.id, exerciseId: 'html-form', code, status: 'in-progress', points: 50 }
          });
          const data = await res.json();
          if (data.success) {
            document.getElementById('exercise-status').textContent = 'Progress saved! Total points: ' + data.totalPoints;
          } else {
            document.getElementById('exercise-status').textContent = 'Error: ' + (data.error||'unknown');
          }
        } catch (e) {
          console.error(e);
          document.getElementById('exercise-status').textContent = 'Network error';
        }
      });
    });
  </script>
</body>
</html>
