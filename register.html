<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - WebStack</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo">
        <h1><a href="index.html">WebStack</a></h1>
      
      </div>
     
    </div>
  </header>

  <main>
    <div class="form-container">
      <h1 style="text-align: center; color: #333; margin-bottom: 2rem;">Create Your Account</h1>
      <p style="text-align: center; color: #666; margin-bottom: 2rem;">Join thousands of students learning web development</p>
      
      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" required placeholder="Enter your full name">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="Enter your email">
          <small>You'll use this to login.</small>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Create a strong password">
          <small>At least 8 characters, includes uppercase, lowercase, and numbers.</small>
        </div>

        <div class="form-group">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" name="confirm" required placeholder="Confirm your password">
        </div>

        <div class="form-group">
          <label for="interest">Primary Interest</label>
          <select id="interest" name="interest" required>
            <option value="">Select your interest...</option>
            <option value="frontend">Frontend Development</option>
            <option value="backend">Backend Development</option>
            <option value="Python">Python</option>
            <option value="React">React</option>
            <option value="web">Web Design</option>

          </select>
        </div>

        <div class="form-group">
          <label style="display: flex; align-items: flex-start; margin: 0;">
            <input type="checkbox" id="terms" name="terms" required style="width: auto; margin-right: 0.5rem; margin-top: 0.25rem;">
            <span>I agree to the <a href="#terms" style="color: #2563eb; text-decoration: none;">Terms of Service</a> and <a href="#privacy" style="color: #2563eb; text-decoration: none;">Privacy Policy</a></span>
          </label>
        </div>

      

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" style="flex: 1;">Create Account</button>
        </div>
      </form>

      <div class="form-footer">
        Already have an account? <a href="login.html">Login here</a>
      </div>

      <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #e0e0e0; text-align: center;">
        <p style="color: #666; margin-bottom: 1rem;">Or sign up with</p>
        <div style="display: flex; gap: 1rem; justify-content: center;">
          <button type="button" class="btn" style="background-color: #f0f0f0; color: #333; flex: 1; max-width: 150px;">Google</button>
          <button type="button" class="btn" style="background-color: #f0f0f0; color: #333; flex: 1; max-width: 150px;">GitHub</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    
    <div class="footer-bottom">
      <p>&copy; 2026 WebStack. All rights reserved.</p>
    </div>
  </footer>

  <script>
    function handleRegister(event) {
      event.preventDefault();
      
      const fullname = document.getElementById('fullname').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const interest = document.getElementById('interest').value;
      
      // Validate passwords match
      if (password !== confirm) {
        alert('Passwords do not match!');
        return;
      }
      
      // Save user data to localStorage
      const userData = {
        fullname: fullname,
        email: email,
        password: password,
        interest: interest,
        joinedDate: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }),
        location: '',
        website: '',
        bio: '',
        isLoggedIn: true
      };
      
      localStorage.setItem('userData', JSON.stringify(userData));
      
      // Simulate registration
      alert(`Registration successful!\nName: ${fullname}\nEmail: ${email}\nInterest: ${interest}`);
      
      // Redirect to dashboard
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 500);
    }
  </script>
</body>
</html>
