<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - WebStack</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    const theme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
  </script>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo">
        <h1><a href="index.html">WebStack</a></h1>
      </div>
      <button class="hamburger-menu" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav id="nav-menu">
        <!-- generated by site.js -->
      </nav>
    </div>
  </header>

  <main class="content">
    <h1 style="text-align:center; margin-bottom:2rem; color:#333;">🏆 Leaderboard</h1>
    <ul id="leaderboard-list" style="max-width:600px;margin:0 auto;list-style:none;padding:0;"></ul>
  </main>

  <footer>
    <div class="footer-bottom">
      <p>&copy; 2026 WebStack. All rights reserved.</p>
    </div>
  </footer>

  <script src="site.js"></script>
  <script>
    async function loadLeaderboard() {
      try {
        const res = await apiRequest('/api/leaderboard');
        if (res.ok) {
          const data = await res.json();
          const ul = document.getElementById('leaderboard-list');
          data.forEach((u, idx) => {
            const li = document.createElement('li');
            li.style.padding = '0.75rem 1rem';
            li.style.borderBottom = '1px solid #e0e0e0';
            li.textContent = `${idx+1}. User ${u.userId} — ${u.points} pts (${u.completedExercises} exercises)`;
            ul.appendChild(li);
          });
        }
      } catch (e) {
        console.error(e);
      }
    }

    document.addEventListener('DOMContentLoaded', loadLeaderboard);
  </script>
</body>
</html>
