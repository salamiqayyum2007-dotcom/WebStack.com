<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - WebStack</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    const theme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
  </script>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo">
        <h1><a href="index.html">WebStack</a></h1>
    
      </div>
    
      <span class="hamburger-label"></span>
      <nav id="nav-menu">
      </nav>
    </div>
  </header>

  <main>
    <div class="form-container">
      <h1 style="text-align: center; color: #333; margin-bottom: 2rem;">Welcome Back</h1>
      
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="Enter your email">
          <small>We'll never share your email.</small>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Enter your password">
          <small>Case sensitive. Must be at least 8 characters.</small>
        </div>

        <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
          <label style="display: flex; align-items: center; margin: 0;">
            <input type="checkbox" id="remember" name="remember" style="width: auto; margin-right: 0.5rem;">
            Remember me
          </label>
          <a href="#forgot" style="color: #2563eb; text-decoration: none; font-size: 0.9rem;">Forgot password?</a>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" style="flex: 1;">Login</button>
        </div>
      </form>

      <div class="form-footer">
        Don't have an account? <a href="register.html">Create an account</a>
      </div>

      <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #e0e0e0; text-align: center;">
        <p style="color: #666; margin-bottom: 1rem;">Or continue with</p>
        <div style="display: flex; gap: 1rem; justify-content: center;">
          <button id="btn-google" type="button" class="btn" style="background-color: #fff; color: #333; flex: 1; max-width: 150px;" onclick="signInWithGoogle()">Google</button>
          <button id="btn-github" type="button" class="btn" style="background-color: #fff; color: #333; flex: 1; max-width: 150px;" onclick="signInWithGitHub()">GitHub</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Forgot password modal -->
  <div id="forgot-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); align-items:center; justify-content:center;">
    <div style="background:var(--bg-primary); padding:1.5rem; border-radius:8px; width:320px; max-width:90%;">
      <h3 style="margin-top:0;">Reset password</h3>
      <p style="color:var(--text-secondary);">Enter your registered email to receive a reset code.</p>
      <div class="form-group">
        <label for="reset-email">Email</label>
        <input id="reset-email" type="email" placeholder="you@example.com" />
      </div>
      <div style="display:flex; gap:0.5rem;">
        <button class="btn btn-primary" onclick="sendResetCode()">Send code</button>
        <button class="btn" onclick="closeForgot()">Cancel</button>
      </div>
      <hr />
      <h4 style="margin:0.5rem 0 0 0;">Have a code?</h4>
      <div class="form-group">
        <label for="reset-code">Code</label>
        <input id="reset-code" type="text" placeholder="123456" />
      </div>
      <div class="form-group">
        <label for="new-password">New password</label>
        <input id="new-password" type="password" placeholder="New password" />
      </div>
      <div style="display:flex; gap:0.5rem;">
        <button class="btn btn-primary" onclick="verifyResetCode()">Verify & Update</button>
      </div>
    </div>
  </div>

  <footer>
   
    <div class="footer-bottom">
      <p>&copy; 2026 WebStack. All rights reserved.</p>
    </div>
  </footer>
  <script src="site.js"></script>
  <script src="auth.js"></script>

  <script>
    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await apiRequest('/api/login', {
          method: 'POST',
          body: { email, password }
        });

        if (res.ok) {
          const data = await res.json();
          saveCurrentUser(data.user);
          alert(`Welcome back, ${data.user.fullname}!`);
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 500);
        } else {
          const err = await res.json();
          alert(err.error || 'Login failed');
        }
      } catch (e) {
        console.error(e);
        alert('Network error during login');
      }
    }

    // Forgot password link behavior
    document.querySelectorAll('a[href="#forgot"]').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        document.getElementById('forgot-modal').style.display = 'flex';
      });
    });

    function closeForgot(){
      document.getElementById('forgot-modal').style.display = 'none';
    }
  </script>
</body>
</html>
